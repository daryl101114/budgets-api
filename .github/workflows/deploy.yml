name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Publish
        run: dotnet publish budget-api.csproj -c Release -o ./publish

      - name: Build migration bundle
        run: dotnet ef migrations bundle --self-contained -r linux-x64 -o ./migrate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Allow runner IP on port 22
        id: whitelist
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "runner_ip=$RUNNER_IP" >> $GITHUB_OUTPUT
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32"

      - name: Copy app files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./publish/*
          target: /var/www/budgifyapi
          strip_components: 1

      - name: Copy migration bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./migrate
          target: /tmp/

      - name: Run migrations and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x /tmp/migrate
            export Cors__AllowedOrigin="$(sudo grep -oP '(?<=Cors__AllowedOrigin=).*' /etc/systemd/system/budgifyapi.service)"
            export Authentication__Issuer="$(sudo grep -oP '(?<=Authentication__Issuer=).*' /etc/systemd/system/budgifyapi.service)"
            export Authentication__Audience="$(sudo grep -oP '(?<=Authentication__Audience=).*' /etc/systemd/system/budgifyapi.service)"
            export Authentication__SecretForKey="$(sudo grep -oP '(?<=Authentication__SecretForKey=).*' /etc/systemd/system/budgifyapi.service)"
            export ConnectionStrings__BudgetsInfoDbConnection="$(sudo grep -oP '(?<=ConnectionStrings__BudgetsInfoDbConnection=).*' /etc/systemd/system/budgifyapi.service)"
            /tmp/migrate
            sudo chown -R www-data:www-data /var/www/budgifyapi
            sudo systemctl restart budgifyapi
            sudo systemctl status budgifyapi --no-pager

      - name: Remove runner IP from security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.whitelist.outputs.runner_ip }}/32"
